# =========================================================
# 1. SMART VIM/TMUX PANE NAVIGATION
# =========================================================
is_vim="ps -o state= -o comm= -t '#{client_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# =========================================================
# 2. GENERAL OPTIONS & MOUSE SUPPORT
# =========================================================
setw -g mode-keys vi
set -g mouse on
set -s set-clipboard on

# =========================================================
# 3. HIGHLIGHTING & CLIPBOARD BINDINGS
# =========================================================
# Press Ctrl+Space in normal mode to enter Copy Mode immediately
bind-key -n C-Space copy-mode

# Press Ctrl+Space inside Copy Mode to start visual selection (begin selection)
bind-key -T copy-mode-vi C-Space send-keys -X begin-selection

# Copy highlighted selection to System Clipboard with Alt+w or y
if-shell "command -v xclip >/dev/null" \
    'bind-key -T copy-mode-vi M-w send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"; \
     bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"; \
     bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"' \
    'bind-key -T copy-mode-vi M-w send-keys -X copy-pipe-and-cancel "pbcopy"; \
     bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"; \
     bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"'

